[project]
name = "onnx-embedder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MinT", email = "tnm1042002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
]

[project.scripts]
onnx-embedder = "onnx_embedder:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
]
