
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: faq_user
      POSTGRES_PASSWORD: faq_dev_password
      POSTGRES_DB: faq
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faq_user -d faq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
